<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>组件库 — 基础</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">
  <div class="page-head">
    <h1 class="page-title">NiceUI 组件库</h1>
    <div class="page-nav">
      <a href="index.html" class="page-nav-a--active">基础</a>
      <a href="feedback.html">反馈</a>
      <a href="data.html">数据</a>
      <a href="layout.html">布局</a>
    </div>
  </div>

  <!-- Buttons -->
  <div class="section">
    <h2 class="section-title">按钮</h2>
    <div class="section-demo">
      <button class="btn btn--primary">主要</button>
      <button class="btn btn--secondary">次要</button>
      <button class="btn btn--text">文字</button>
      <button class="btn btn--primary btn--disabled">禁用</button>
      <button class="btn btn--primary btn--sm">小号</button>
      <button class="btn btn--primary btn--lg">大号</button>
      <button class="btn btn--primary"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.5" stroke="currentColor" stroke-width="1.3"/><path d="M7 4V10M4 7H10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>图标</button>
    </div>
  </div>

  <!-- Inputs -->
  <div class="section">
    <h2 class="section-title">输入框</h2>
    <div class="section-demo">
      <div class="input-group"><label class="input-label">默认</label><input class="input" type="text" placeholder="请输入..."></div>
      <div class="input-group"><label class="input-label">聚焦</label><input class="input" type="text" value="已输入"></div>
      <div class="input-group"><label class="input-label">禁用</label><input class="input input--disabled" type="text" value="不可编辑" disabled></div>
    </div>
  </div>

  <!-- Select -->
  <div class="section">
    <h2 class="section-title">下拉选择</h2>
    <div class="section-demo">
      <div class="select-wrap">
        <button class="select-trigger">全部</button>
        <div class="select-panel">
          <div class="select-option select-option--selected">全部</div>
          <div class="select-option">设计</div>
          <div class="select-option">开发</div>
          <div class="select-option">产品</div>
        </div>
      </div>
      <div class="select-wrap">
        <button class="select-trigger">按时间排序</button>
        <div class="select-panel">
          <div class="select-option select-option--selected">按时间排序</div>
          <div class="select-option">按热度排序</div>
          <div class="select-option">按评分排序</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Checkbox & Radio -->
  <div class="section">
    <h2 class="section-title">选择控件</h2>
    <div class="section-demo">
      <div class="check-group">
        <label class="check-label"><input type="checkbox" checked><span class="check-box"></span>已选</label>
        <label class="check-label"><input type="checkbox"><span class="check-box"></span>未选</label>
        <label class="check-label"><input type="checkbox" checked><span class="check-box"></span>选项三</label>
      </div>
      <div class="radio-group">
        <label class="radio-label"><input type="radio" name="r1" checked><span class="radio-circle"></span>A</label>
        <label class="radio-label"><input type="radio" name="r1"><span class="radio-circle"></span>B</label>
        <label class="radio-label"><input type="radio" name="r1"><span class="radio-circle"></span>C</label>
      </div>
    </div>
  </div>

  <!-- Toggle -->
  <div class="section">
    <h2 class="section-title">开关</h2>
    <div class="section-demo">
      <button class="toggle toggle--on"></button>
      <button class="toggle"></button>
      <span style="font-size:13px;color:var(--text-secondary)">点击切换</span>
    </div>
  </div>

  <!-- Tags -->
  <div class="section">
    <h2 class="section-title">标签</h2>
    <div class="section-demo">
      <span class="tag tag--default">默认</span>
      <span class="tag tag--brand">品牌</span>
      <span class="tag tag--brand-light">强调</span>
      <span class="tag tag--danger">警告</span>
      <span class="tag tag--default tag--link">可点击</span>
      <span class="tag tag--brand tag--link">可移除 ×</span>
    </div>
  </div>

</div>

<script>
// Select panels with exit animation
function hidePanel(p){p.classList.remove('select-panel--open');p.classList.add('select-panel--exit');setTimeout(function(){p.classList.remove('select-panel--exit')},150)}
document.querySelectorAll('.select-trigger').forEach(function(t){t.addEventListener('click',function(e){e.stopPropagation();var p=this.nextElementSibling;if(p.classList.contains('select-panel--open')){hidePanel(p)}else{p.classList.add('select-panel--open')}})});
document.querySelectorAll('.select-option').forEach(function(o){o.addEventListener('click',function(){if(!this.closest('.select-panel'))return;var t=this.closest('.select-wrap').querySelector('.select-trigger');t.textContent=this.textContent;t.closest('.select-wrap').querySelectorAll('.select-option').forEach(function(a){a.classList.remove('select-option--selected')});this.classList.add('select-option--selected');hidePanel(this.closest('.select-panel'))})});
document.addEventListener('click',function(){document.querySelectorAll('.select-panel--open').forEach(function(p){hidePanel(p)})});
// Toggles
document.querySelectorAll('.toggle').forEach(function(t){t.addEventListener('click',function(){this.classList.toggle('toggle--on')})});
</script>
</body>
</html>
